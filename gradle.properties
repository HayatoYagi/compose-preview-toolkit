version=0.2.0
group=io.github.hayatoyagi

org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

android.useAndroidX=true

# Required by the sample module to exercise the plugin's screenshot-test wiring end to end.
android.experimental.enableScreenshotTest=true

# vanniktech-maven-publish otherwise leaves every Central Portal deployment sitting in
# VALIDATED state, requiring someone to manually click "Publish" on central.sonatype.com for
# every single release. Everything else about releasing this repo is already automated
# end-to-end through GitHub Actions — this makes Maven Central match that.
#
# Requires mavenPublish (com.vanniktech.maven.publish, see gradle/libs.versions.toml) >= 0.33.0:
# older versions don't recognize this property and silently ignore it (no error, no warning) —
# that exact silent failure is what got v0.2.0 stuck in VALIDATED on 0.31.0. Before 0.33.0 the
# equivalent was SONATYPE_AUTOMATIC_RELEASE=true.
mavenCentralAutomaticPublishing=true

[versions]
agp = "9.2.1"
kotlin = "2.4.0"
ksp = "2.3.9"
compose = "1.11.4"
screenshot = "0.0.1-alpha15"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
material3 = "1.5.0-alpha23"
# Verified by resolving against dl.google.com's maven-metadata.xml directly (not trusted from
# memory, per this repo's "verify via real local builds" convention): these are the latest
# *stable* (non -alphaXX/-betaXX/-rcXX) releases as of this writing. navigation3-runtime/-ui had
# already moved past 1.1.4/1.1.1 (the versions a related-project's earlier research turned up) to
# 1.1.5; lifecycle-viewmodel-navigation3 had moved past 2.10.0 to 2.11.0.
navigation3-runtime = "1.1.5"
navigation3-ui = "1.1.5"
lifecycle-viewmodel-navigation3 = "2.11.0"
# The version currently under local development (see sample/settings.gradle.kts for why that's
# permanently ahead of whatever's actually published) — resolves via mavenLocal() after running
# the publish step described in the root README. Single source of truth for both plugin ids
# below, bumped alongside the root gradle.properties `version=` by bump-version.yml.
composePreviewToolkit = "0.3.0"

[libraries]
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
navigation3-runtime = { module = "androidx.navigation3:navigation3-runtime", version.ref = "navigation3-runtime" }
navigation3-ui = { module = "androidx.navigation3:navigation3-ui", version.ref = "navigation3-ui" }
lifecycle-viewmodel-navigation3 = { module = "androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "lifecycle-viewmodel-navigation3" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
composePreviewToolkit = { id = "io.github.hayatoyagi.compose-preview-toolkit", version.ref = "composePreviewToolkit" }
composePreviewToolkitNavGraph = { id = "io.github.hayatoyagi.compose-preview-toolkit.navgraph", version.ref = "composePreviewToolkit" }

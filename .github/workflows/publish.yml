name: Publish

on:
  push:
    tags: ['v*']
  workflow_call:
    secrets:
      GRADLE_PUBLISH_KEY:
        required: true
      GRADLE_PUBLISH_SECRET:
        required: true
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      GPG_PRIVATE_KEY:
        required: true
      GPG_PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      target:
        description: >-
          What to (re-)publish. Both destinations are independent releases (Gradle Plugin
          Portal rejects re-publishing a version that already succeeded there), so a partial
          failure needs to retry only the side that actually failed.
        type: choice
        required: true
        default: 'both'
        options: ['both', 'plugin-portal', 'maven-central']
      ref:
        description: 'Tag or ref to publish (defaults to the latest tag if left blank).'
        required: false
        default: ''

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Gradle Plugin Portal: the gradle-plugin and nav-graph-gradle-plugin modules.
      - name: Publish plugins to Gradle Plugin Portal
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'plugin-portal'
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: ./gradlew :gradle-plugin:publishPlugins :nav-graph-gradle-plugin:publishPlugins

      # Maven Central (Central Portal): the annotations & ksp-processor libraries gradle-plugin
      # references at runtime, plus nav-graph-model/nav-graph-psi-analyzer which
      # nav-graph-gradle-plugin references (nav-graph-model at regular compile time,
      # nav-graph-psi-analyzer resolved fresh into an isolated Worker classpath — see
      # ComposePreviewToolkitNavGraphPlugin's kdoc).
      #
      # --no-configuration-cache: vanniktech-maven-publish's Central Portal repository object
      # doesn't serialize cleanly under Gradle's configuration cache (enabled by default via
      # this repo's gradle.properties) — fails with "Services of type BuildFeatures are not
      # available for injection into instances of type BuildService."
      - name: Publish annotations, ksp-processor, nav-graph-model & nav-graph-psi-analyzer to Maven Central
        if: github.event_name != 'workflow_dispatch' || inputs.target == 'both' || inputs.target == 'maven-central'
        env:
          ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_PRIVATE_KEY }}
          ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          ./gradlew --no-configuration-cache \
            :annotations:publishAllPublicationsToMavenCentralRepository \
            :ksp-processor:publishAllPublicationsToMavenCentralRepository \
            :nav-graph-model:publishAllPublicationsToMavenCentralRepository \
            :nav-graph-psi-analyzer:publishAllPublicationsToMavenCentralRepository

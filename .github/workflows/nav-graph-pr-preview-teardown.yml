name: Nav Graph PR Preview Teardown

# Deliberately separate from ci.yml: ci.yml's pull_request trigger has no `types:` filter, so it
# only ever gets the implicit default [opened, synchronize, reopened] and never fires on `closed`.
# This workflow exists solely to catch that event and remove the PR's live preview.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write
  pull-requests: write

jobs:
  teardown:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No JDK/Gradle/mavenLocal setup needed here: deploy-nav-graph-site's own
      # `if: github.event.action != 'closed'` already skips its Gradle build step entirely on this
      # event, so this call only exercises rossjrw/pr-preview-action's teardown (removal) path,
      # which needs no build output at all.
      - name: Remove PR preview of sample nav graph site
        uses: ./.github/actions/deploy-nav-graph-site
        with:
          working-directory: sample
          site-task: ':app:generateDebugNavGraphSite'
          site-directory: sample/app/build/composePreviewToolkit/navGraphSite/debug
          mode: 'pr-preview'

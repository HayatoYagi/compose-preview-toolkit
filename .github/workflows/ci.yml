name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and test annotations, ksp-processor, gradle-plugin, nav-graph-psi-analyzer, nav-graph-gradle-plugin
        run: ./gradlew --stacktrace :annotations:build :ksp-processor:build :gradle-plugin:build :nav-graph-psi-analyzer:build :nav-graph-gradle-plugin:build

      # sample/ is a separate Gradle build (see sample/settings.gradle.kts) that applies the
      # plugin(s) exactly like a real consumer would, so it needs this repo's current in-progress
      # version resolvable via mavenLocal() before it can configure at all. sample/app,
      # sample/feature-a, and sample/feature-b all apply the navgraph plugin id, so
      # nav-graph-gradle-plugin (and its nav-graph-psi-analyzer dependency) publishing is just as
      # required here as the screenshot-testing plugin's modules, not optional.
      - name: Publish current version to mavenLocal for sample/ to consume
        run: ./gradlew --stacktrace :annotations:publishToMavenLocal :ksp-processor:publishToMavenLocal :gradle-plugin:publishToMavenLocal :nav-graph-psi-analyzer:publishToMavenLocal :nav-graph-gradle-plugin:publishToMavenLocal

      # Dogfeeds this repo's own composite action against the sample module, so a broken
      # action.yml or a broken plugin/processor change surfaces in this repo's own CI.
      - name: Update & validate sample screenshot tests
        uses: ./.github/actions/update-validate-screenshot-tests
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: sample

      # Builds and publishes sample/app's nav graph site: on push to main, this deploys the
      # persisted main site to gh-pages' root; on pull_request (ci.yml's trigger has no `types:`
      # filter, so only the implicit default [opened, synchronize, reopened] reach it), this
      # deploys a live preview — including this run's freshly-committed screenshot baselines from
      # the step above — to pr-preview/pr-<number>/ on gh-pages, with a sticky PR comment linking
      # to it. Kept in this same job (not a separate workflow triggered off the same pull_request
      # event) so it can't race the baseline-update step above: a standalone workflow could check
      # out and build before that step's auto-commit push landed, deploying a preview with stale
      # thumbnails. Also serves as this repo's build dogfooding for both event types, since a
      # broken action.yml or plugin/analyzer change fails this step just the same. Teardown on PR
      # close is handled by the separate nav-graph-pr-preview-teardown.yml, which doesn't need any
      # of this job's Gradle/mavenLocal setup.
      - name: Deploy sample nav graph site to GitHub Pages
        uses: ./.github/actions/deploy-nav-graph-site
        with:
          working-directory: sample
          site-task: ':app:generateDebugNavGraphSite'
          site-directory: sample/app/build/composePreviewToolkit/navGraphSite/debug
          mode: 'github-pages'

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Build and test annotations, ksp-processor, gradle-plugin, nav-graph-psi-analyzer, nav-graph-gradle-plugin
        run: ./gradlew --stacktrace :annotations:build :ksp-processor:build :gradle-plugin:build :nav-graph-psi-analyzer:build :nav-graph-gradle-plugin:build

      # sample/ is a separate Gradle build (see sample/settings.gradle.kts) that applies the
      # plugin(s) exactly like a real consumer would, so it needs this repo's current in-progress
      # version resolvable via mavenLocal() before it can configure at all. sample/app,
      # sample/feature-a, and sample/feature-b all apply the navgraph plugin id, so
      # nav-graph-gradle-plugin (and its nav-graph-psi-analyzer dependency) publishing is just as
      # required here as the Phase 1 modules, not optional.
      - name: Publish current version to mavenLocal for sample/ to consume
        run: ./gradlew --stacktrace :annotations:publishToMavenLocal :ksp-processor:publishToMavenLocal :gradle-plugin:publishToMavenLocal :nav-graph-psi-analyzer:publishToMavenLocal :nav-graph-gradle-plugin:publishToMavenLocal

      # Dogfeeds this repo's own composite action against the sample module, so a broken
      # action.yml or a broken plugin/processor change surfaces in this repo's own CI.
      - name: Update & validate sample screenshot tests
        uses: ./.github/actions/update-validate-screenshot-tests
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: sample

      # Build-only dogfooding: exercises generateDebugNavGraphSite on every push/PR without
      # publishing anywhere, so a broken action.yml or a broken plugin/analyzer change surfaces
      # here regardless of which of the two steps below (if either) also runs. mode: 'pages' is
      # never used in this repo — it would need permissions/settings this job doesn't have
      # (pages/id-token + github-pages environment), and is incompatible with the pr-preview
      # deploy below anyway (see README.md's "Nav Graph" caveat on Pages Source settings being
      # repo-wide). mode: 'build' is this action's default, but named explicitly here since this
      # call site is exactly the case the mode surface exists to describe.
      - name: Build sample nav graph site
        uses: ./.github/actions/deploy-nav-graph-site
        with:
          working-directory: sample
          site-task: ':app:generateDebugNavGraphSite'
          site-directory: sample/app/build/composePreviewToolkit/navGraphSite/debug
          mode: 'build'

      # Publishes a live preview of the site just built above — including this run's
      # freshly-committed screenshot baselines from the step above — to pr-preview/pr-<number>/ on
      # the gh-pages branch, with a sticky PR comment linking to it. Deliberately kept in this same
      # job/checkout (not a separate workflow triggered off the same pull_request event) so it
      # can't race the baseline-update step above: a standalone workflow could check out and build
      # before that step's auto-commit push landed, deploying a preview with stale thumbnails.
      # Teardown on PR close is handled by the separate nav-graph-pr-preview-teardown.yml, which
      # doesn't need any of this job's Gradle/mavenLocal setup.
      - name: Deploy PR preview of sample nav graph site
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/deploy-nav-graph-site
        with:
          working-directory: sample
          site-task: ':app:generateDebugNavGraphSite'
          site-directory: sample/app/build/composePreviewToolkit/navGraphSite/debug
          mode: 'pr-preview'

      # Persists the main site whenever main changes, deploying the same directory the mode:
      # 'build' step above just generated (no rebuild needed). Branch-based rather than this
      # action's own mode: 'pages', so it can share the same gh-pages branch as the pr-preview
      # deploy above without the repo Pages Source setting conflict described in README.md's "Nav
      # Graph" caveat (mode: 'pages' requires Source = GitHub Actions; pr-preview requires Source =
      # Deploy from branch — mutually exclusive and repo-wide). clean-exclude/force: false ensure
      # this never wipes or force-pushes over whatever PR previews are currently live under
      # pr-preview/.
      - name: Deploy main site to gh-pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: sample/app/build/composePreviewToolkit/navGraphSite/debug
          branch: gh-pages
          clean-exclude: pr-preview
          force: false

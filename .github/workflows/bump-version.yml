name: Bump Version

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version part to bump'
        type: choice
        required: true
        options: [patch, minor, major]

permissions:
  contents: write
  pull-requests: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute new version
        id: version
        run: |
          current=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ github.event.inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          echo "new_version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Update gradle.properties
        run: sed -i "s/^version=.*/version=${{ steps.version.outputs.new_version }}/" gradle.properties

      # sample/app, sample/feature-a, and sample/feature-b each hardcode the plugin version(s)
      # they apply (see the comment in sample/settings.gradle.kts explaining why sample is a
      # separate build) — keep them all in sync with every bump. All three apply both plugin ids
      # (each module has its own @ScreenshotPreview-annotated screen, and its own entry<X> {}
      # registration worth including in the nav graph), so both patterns run against all three
      # files.
      - name: Update sample plugin versions
        run: |
          sed -i \
            -e 's/id("io.github.hayatoyagi.compose-preview-toolkit") version ".*"/id("io.github.hayatoyagi.compose-preview-toolkit") version "${{ steps.version.outputs.new_version }}"/' \
            -e 's/id("io.github.hayatoyagi.compose-preview-toolkit.navgraph") version ".*"/id("io.github.hayatoyagi.compose-preview-toolkit.navgraph") version "${{ steps.version.outputs.new_version }}"/' \
            sample/app/build.gradle.kts sample/feature-a/build.gradle.kts sample/feature-b/build.gradle.kts

      - name: Create release PR
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore: release v${{ steps.version.outputs.new_version }}"
          title: "chore: release v${{ steps.version.outputs.new_version }}"
          branch: "release/v${{ steps.version.outputs.new_version }}"
          base: main

name: 'Build & Deploy Nav Graph Site'
description: >-
  Runs a compose-preview-toolkit nav-graph site generation task (generateDebugNavGraphSite),
  and optionally publishes the result via one of two mutually exclusive mechanisms selected by
  the mode input: a single shared GitHub Pages site ("pages"), or a per-pull-request preview
  posted as a sticky PR comment ("pr-preview"). Building always happens except when tearing down
  a closed PR's preview; publishing is opt-in via mode, so the same action can be used for
  build-only CI dogfooding (every PR, the default), a real Pages deploy (e.g. a workflow
  triggered only on pushes to main), or per-PR previews.
author: 'HayatoYagi'

inputs:
  working-directory:
    description: >-
      Directory containing the gradlew invoked by this action. Defaults to the repo root; set
      this if the site-generating module lives in a separate Gradle build (own gradlew), e.g.
      this repo's own sample/ (see sample/settings.gradle.kts for why it's separate).
    required: false
    default: '.'
  site-task:
    description: >-
      Gradle task that generates the site, e.g. ":app:generateDebugNavGraphSite". Run relative to
      working-directory.
    required: true
  site-directory:
    description: >-
      Path to the generated site directory (containing index.html), relative to the repository
      root — not working-directory — since actions/upload-pages-artifact and pr-preview-action
      both resolve their own path inputs relative to the workspace root. E.g.
      "sample/app/build/composePreviewToolkit/navGraphSite/debug".
    required: true
  gradle-args:
    description: 'Extra arguments appended to the Gradle invocation (e.g. -Djava.net.preferIPv4Stack=true).'
    required: false
    default: ''
  mode:
    description: >-
      What to do with the built site: "build" (default) only runs the Gradle task — useful for
      dogfooding it on every PR without needing any Pages permissions at all. "pages" additionally
      deploys site-directory to GitHub Pages via the official Pages Deployments API
      (configure-pages/upload-pages-artifact/deploy-pages); the calling job must additionally set
      `permissions: { pages: write, id-token: write }` and `environment: github-pages` itself — a
      composite action cannot set job-level permissions or environment on its caller. This API
      only supports one live deployment per repo, so it replaces the whole site on every run.
      "pr-preview" instead publishes the built site to a per-PR subdirectory
      (pr-preview/pr-<number>/ by default) on a branch, via rossjrw/pr-preview-action, and posts a
      sticky PR comment with the live URL; it tears the subdirectory down automatically when the
      calling workflow runs on the PR's "closed" event. "pages" and "pr-preview" are mutually
      exclusive publishing mechanisms for the *same* repo's Pages site — see README.md's "Nav
      Graph" section for why (GitHub Pages' "Deploy from branch" vs "GitHub Actions" source
      setting is repo-wide, not per-workflow) and how to combine per-PR previews with a persisted
      main deployment if you want both.
    required: false
    default: 'build'
  github-token:
    description: >-
      Token used by mode "pr-preview" to push the preview commit and post/update the sticky PR
      comment. Only used when mode is "pr-preview"; ignored otherwise. The default GITHUB_TOKEN
      works as long as the calling job has `permissions: { contents: write, pull-requests: write }`.
    required: false
    default: ${{ github.token }}
  pr-preview-branch:
    description: >-
      Branch that mode "pr-preview" deploys previews to. Only used when mode is "pr-preview". The
      repo's GitHub Pages source setting must be "Deploy from branch" pointed at this branch — see
      README.md's "Nav Graph" section.
    required: false
    default: 'gh-pages'
  pr-preview-umbrella-dir:
    description: >-
      Directory on pr-preview-branch containing every PR's preview subdirectory. Only used when
      mode is "pr-preview".
    required: false
    default: 'pr-preview'

outputs:
  page-url:
    description: 'URL of the deployed Pages site. Only set when mode is "pages".'
    value: ${{ steps.deployment.outputs.page_url }}
  preview-url:
    description: >-
      URL of the PR preview. Only set when mode is "pr-preview" and this run deployed a preview
      (not when it tore one down on PR close).
    value: ${{ steps.pr-preview.outputs.preview-url }}

runs:
  using: 'composite'
  steps:
    # Nothing to build when tearing down a closed PR's preview — pr-preview-action's own "auto"
    # action already detects the closed event and switches to removal, which doesn't need a
    # freshly-built site at all.
    - name: Generate nav graph site
      if: github.event.action != 'closed'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: ./gradlew ${{ inputs.site-task }} ${{ inputs.gradle-args }}

    - name: Configure Pages
      if: inputs.mode == 'pages'
      uses: actions/configure-pages@v5

    - name: Upload site artifact
      if: inputs.mode == 'pages'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ${{ inputs.site-directory }}

    - name: Deploy to GitHub Pages
      if: inputs.mode == 'pages'
      id: deployment
      uses: actions/deploy-pages@v4

    - name: Deploy PR preview
      if: inputs.mode == 'pr-preview'
      id: pr-preview
      uses: rossjrw/pr-preview-action@v1
      with:
        token: ${{ inputs.github-token }}
        source-dir: ${{ inputs.site-directory }}
        preview-branch: ${{ inputs.pr-preview-branch }}
        umbrella-dir: ${{ inputs.pr-preview-umbrella-dir }}

name: 'Build & Deploy Nav Graph Site'
description: >-
  Runs a compose-preview-toolkit nav-graph site generation task (generateDebugNavGraphSite), and
  optionally publishes the result via the mode input. "build" (default) only runs the Gradle
  task — no Pages permissions needed at all, useful for build-only CI dogfooding on every PR.
  "github-pages" runs the full GitHub-Pages-with-previews experience end to end from this single
  call, branching internally on the triggering event so the caller doesn't have to hand-assemble
  multiple steps or workflows: on `push` it deploys the built site as the persisted main site
  (branch-based deploy to pages-branch's root); on `pull_request`
  (opened/reopened/synchronize) it deploys a live per-PR preview via rossjrw/pr-preview-action and
  posts its sticky PR comment (that action's own — preview link plus QR code); on `pull_request:
  closed` it tears that preview down (skipping its own build step, since there's nothing to
  publish). Every build (both this mode and "build") also stamps the generated site itself with a
  "Built from commit ..." footer naming the commit/branch/PR it was built from. Any other event
  type under "github-pages" mode fails fast, since it almost always means the calling workflow's
  trigger is misconfigured.
author: 'HayatoYagi'

inputs:
  working-directory:
    description: >-
      Directory containing the gradlew invoked by this action. Defaults to the repo root; set
      this if the site-generating module lives in a separate Gradle build (own gradlew), e.g.
      this repo's own sample/ (see sample/settings.gradle.kts for why it's separate).
    required: false
    default: '.'
  site-task:
    description: >-
      Gradle task that generates the site, e.g. ":app:generateDebugNavGraphSite". Run relative to
      working-directory.
    required: true
  site-directory:
    description: >-
      Path to the generated site directory (containing index.html), relative to the repository
      root — not working-directory — since the branch-deploy step and pr-preview-action both
      resolve their own path inputs relative to the workspace root. E.g.
      "sample/app/build/composePreviewToolkit/navGraphSite/debug".
    required: true
  gradle-args:
    description: 'Extra arguments appended to the Gradle invocation (e.g. -Djava.net.preferIPv4Stack=true).'
    required: false
    default: ''
  mode:
    description: >-
      What to do with the built site: "build" (default) only runs the Gradle task — useful for
      dogfooding it on every PR without needing any Pages permissions at all. "github-pages" is
      the full managed experience: on `push` it deploys site-directory as the persisted main site
      (branch-based deploy to pages-branch's root, excluding pr-preview-umbrella-dir from
      cleanup so it never wipes live previews); on `pull_request`
      (opened/reopened/synchronize) it deploys a live per-PR preview via rossjrw/pr-preview-action
      to pages-branch, under pr-preview-umbrella-dir/pr-<number>/, with a sticky PR comment
      linking to it; on `pull_request: closed` it tears that preview down. Both directions use the
      same branch-based mechanism, so the repo's GitHub Pages source setting is just "Deploy from
      branch" pointed at pages-branch — see README.md's "Nav Graph" section.
    required: false
    default: 'build'
  github-token:
    description: >-
      Token used by mode "github-pages" to push the main-site/preview deploy commits and
      post/update the sticky PR comment. Only used when mode is "github-pages"; ignored
      otherwise. The default GITHUB_TOKEN works as long as the calling job has `permissions: {
      contents: write, pull-requests: write }`.
    required: false
    default: ${{ github.token }}
  pages-branch:
    description: >-
      Branch that mode "github-pages" deploys both the persisted main site and PR previews to.
      Only used when mode is "github-pages". The repo's GitHub Pages source setting must be
      "Deploy from branch" pointed at this branch — see README.md's "Nav Graph" section.
    required: false
    default: 'gh-pages'
  pr-preview-umbrella-dir:
    description: >-
      Directory on pages-branch containing every PR's preview subdirectory. Only used when
      mode is "github-pages" — also passed as the persisted main-site deploy's clean-exclude
      pattern so that deploy never wipes whatever PR previews are currently live under it.
    required: false
    default: 'pr-preview'

outputs:
  page-url:
    description: >-
      Best-effort URL of the persisted main site, set only when mode is "github-pages" and this
      run was triggered by a `push`. Computed from repository context
      (https://<owner>.github.io/<repo>/), since the branch-deploy action itself has no URL
      output — double check it against your repo's actual Pages URL if you use a custom domain or
      this is a user/org root-page repo (`<owner>.github.io`). Empty on `pull_request` runs.
    value: ${{ steps.compute-page-url.outputs.page-url }}
  preview-url:
    description: >-
      URL of the PR preview, straight from rossjrw/pr-preview-action's own output. Only set when
      mode is "github-pages", this run was triggered by `pull_request`, and it deployed a preview
      (opened/reopened/synchronize) rather than tearing one down (closed).
    value: ${{ steps.pr-preview.outputs.preview-url }}

runs:
  using: 'composite'
  steps:
    - name: Validate event for github-pages mode
      if: >-
        inputs.mode == 'github-pages' && github.event_name != 'push' && github.event_name != 'pull_request'
      shell: bash
      run: |
        echo "::error::mode 'github-pages' only knows how to handle 'push' and 'pull_request' events (this run's event was '${{ github.event_name }}'). Check the calling workflow's 'on:' triggers."
        exit 1

    # Nothing to build when tearing down a closed PR's preview — rossjrw/pr-preview-action's own
    # "auto" action already detects the closed event and switches to removal, which doesn't need a
    # freshly-built site at all.
    - name: Generate nav graph site
      if: github.event.action != 'closed'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      # CPT_BUILD_SHA is pull_request.head.sha rather than the ambient GITHUB_SHA on PR runs — see
      # GenerateDebugNavGraphSite.generate()'s kdoc for why. CPT_BUILD_PR_NUMBER is '' outside
      # pull_request, which that same task treats as "no PR to show".
      run: ./gradlew ${{ inputs.site-task }} ${{ inputs.gradle-args }}
      env:
        CPT_BUILD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        CPT_BUILD_BRANCH: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}
        CPT_BUILD_PR_NUMBER: ${{ github.event_name == 'pull_request' && github.event.pull_request.number || '' }}

    - name: Deploy main site to GitHub Pages
      if: inputs.mode == 'github-pages' && github.event_name == 'push'
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        token: ${{ inputs.github-token }}
        folder: ${{ inputs.site-directory }}
        branch: ${{ inputs.pages-branch }}
        clean-exclude: ${{ inputs.pr-preview-umbrella-dir }}
        # clean-exclude only protects excluded paths from the clean step's *deletion* pass — it
        # does nothing against force's history-rewriting push, which would still discard whatever
        # commits pr-preview-action made to this same branch. force is on by default, so this must
        # be explicit.
        force: false

    - name: Compute main site URL
      if: inputs.mode == 'github-pages' && github.event_name == 'push'
      id: compute-page-url
      shell: bash
      run: echo "page-url=https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_OUTPUT"

    - name: Deploy PR preview
      if: inputs.mode == 'github-pages' && github.event_name == 'pull_request'
      id: pr-preview
      uses: rossjrw/pr-preview-action@v1
      with:
        token: ${{ inputs.github-token }}
        source-dir: ${{ inputs.site-directory }}
        preview-branch: ${{ inputs.pages-branch }}
        umbrella-dir: ${{ inputs.pr-preview-umbrella-dir }}

[versions]
agp = "9.2.1"
kotlin = "2.4.0"
ksp = "2.3.9"
compose = "1.11.4"
screenshot = "0.0.1-alpha15"
android-compileSdk = "37"
android-minSdk = "24"
android-targetSdk = "37"
androidx-activity = "1.13.0"
material3 = "1.5.0-alpha23"
mavenPublish = "0.37.0"
gradlePluginPublish = "1.3.1"
junit = "6.1.3"

[libraries]
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-runtime = { module = "androidx.compose.runtime:runtime", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
screenshot-validation-api = { module = "com.android.tools.screenshot:screenshot-validation-api", version.ref = "screenshot" }
ksp-symbol-processing-api = { module = "com.google.devtools.ksp:symbol-processing-api", version.ref = "ksp" }
# Standalone Kotlin PSI parsing (KotlinCoreEnvironment/PsiFileFactory -> KtFile), the same
# artifact tools like ktlint/detekt use to get a KtFile outside a real compiler invocation.
# Pinned to version.ref = "kotlin" (not a separately-tracked literal) so it can never drift from
# the toolchain version above: kotlin-compiler-embeddable:2.4.0 exists on mavenCentral(), so no
# discrepancy to document here.
#
# Used by nav-graph-psi-analyzer, a plain JVM library with no Gradle-API dependency, which exposes
# it via api(...) because its public API (KotlinPsiParser/NavNodeScanner) returns
# KtFile/KtCallExpression types straight from it — the exposure is load-bearing, not accidental.
# nav-graph-gradle-plugin only depends on nav-graph-psi-analyzer via compileOnly, resolving it
# fresh into an isolated Gradle Worker classpath at task-execution time instead — see
# ComposePreviewToolkitNavGraphPlugin's kdoc — so this never lands on a consumer's own classpath.
kotlin-compiler-embeddable = { module = "org.jetbrains.kotlin:kotlin-compiler-embeddable", version.ref = "kotlin" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter", version.ref = "junit" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidLibrary = { id = "com.android.library", version.ref = "agp" }
kotlinJvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
screenshot = { id = "com.android.compose.screenshot", version.ref = "screenshot" }
mavenPublish = { id = "com.vanniktech.maven.publish", version.ref = "mavenPublish" }
gradlePluginPublish = { id = "com.gradle.plugin-publish", version.ref = "gradlePluginPublish" }
